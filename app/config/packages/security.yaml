security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        api_users:
            memory:
                users:
                    jwt_client: { roles: [ROLE_API_CLIENT] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        convert:
            pattern: ^/convert
            stateless: true
            lazy: true
            provider: api_users
            custom_authenticators:
                - App\Security\JwtAuthenticator
            entry_point: App\Security\JwtAuthenticator

        main:
            lazy: true
            security: false

    access_control:
        - { path: ^/convert, roles: ROLE_API_CLIENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
